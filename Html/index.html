<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Страница 1</title>
</head>
<body>
<form action="/test" method="post">
    <P><label>
        Тектовое поле 1 <input type="text" name="text1" placeholder="Текстовое поле 1">
    </label></P>
    <P><label>
        Тектовое поле 2 <input type="text" name="text2" placeholder="Текстовое поле 2">
    </label></P>
    <P><label>
        Многострочное поле ввода 1 <textarea name="textarea1" placeholder="Мнгострочное поле ввода 1"></textarea>
    </label></P>
    <P><label>
        Многострочное поле ввода 2 <textarea name="textarea2" placeholder="Мнгострочное поле ввода 2"></textarea>
    </label></P>
    <P><label>
        Чекбокс 1 <input type="checkbox" name="checkbox1">
    </label></P>
    <P><label>
        Чекбокс 2 <input type="checkbox" name="checkbox2">
    </label></P>
    <P><label>
        Чекбокс 3 <input type="checkbox" name="checkbox3">
    </label></P>
    <P><label>
        Радио 1 <input type="radio" value="1" name="radio">
    </label></P>
    <P><label>
        Радио 2 <input type="radio" value="2" name="radio">
    </label></P>
    <P><label>
        Радио 3 <input type="radio" value="3" name="radio">
    </label></P>
    <p><label>
        Выпадающий список единичный
        <select name="select_single">
            <option>Пункт 1</option>
            <option>Пункт 2</option>
            <option>Пункт 3</option>
        </select>
    </label></p>
    <p><label>
        Выпадающий список множественный
        <select size="1" multiple name="select_multiple">
            <option>Пункт 1</option>
            <option>Пункт 2</option>
            <option>Пункт 3</option>
            <option>Пункт 4</option>
            <option>Пункт 5</option>
        </select>
    </label></p>
    <button type="reset">Очистить форму</button>
    <button type="submit">Отправить форму</button>
     <p><a href="page2.html">Вторая страница</a></p>
</form>
</body>
</html>
