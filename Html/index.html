<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница 1</title>
</head>
<body>
<form action="/test" method="post">
    <p>
        <label>
            Текстовое поле 1 <input type="text" name="text1" placeholder="Текстовое поле 1">
        </label>
    </p>
    <p>
        <label>
            Текстовое поле 2 <input type="text" name="text2" placeholder="Текстовое поле 2">
        </label>
    </p>
    <p>
        <label>
            Многострочное поле ввода 1 <textarea name="textarea1" placeholder="Мнгострочное поле ввода 1"></textarea>
        </label>
    </p>
    <p>
        <label>
            Многострочное поле ввода 2 <textarea name="textarea2" placeholder="Мнгострочное поле ввода 2"></textarea>
        </label>
    </p>
    <p>
        <label>
            <input type="checkbox" name="checkbox1"> Чекбокс 1
        </label>
    </p>
    <p>
        <label>
            <input type="checkbox" name="checkbox2"> Чекбокс 2
        </label>
    </p>
    <p>
        <label>
            <input type="checkbox" name="checkbox3"> Чекбокс 3
        </label>
    </p>
    <p>
        <label>
            <input type="radio" value="1" name="radio"> Радио 1
        </label>
    </p>
    <p>
        <label>
            <input type="radio" value="2" name="radio"> Радио 2
        </label>
    </p>
    <p>
        <label>
            <input type="radio" value="3" name="radio"> Радио 3
        </label>
    </p>
    <p>
        <label>
            Выпадающий список единичный
            <select name="select_single">
                <option>Пункт 1</option>
                <option>Пункт 2</option>
                <option>Пункт 3</option>
            </select>
        </label>
    </p>
    <p>
        <label>
            Выпадающий список множественный
            <select size="1" multiple name="select_multiple">
                <option>Пункт 1</option>
                <option>Пункт 2</option>
                <option>Пункт 3</option>
                <option>Пункт 4</option>
                <option>Пункт 5</option>
            </select>
        </label>
    </p>
    <button type="reset">Очистить форму</button>
    <button type="submit">Отправить форму</button>
    <p><a href="page2.html">Вторая страница</a></p>
</form>
</body>
</html>
