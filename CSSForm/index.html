<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CSS Form</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1 class="call-request-form-header">Отправить заявку</h1>
</header>
<form class="call-request-form" action="/test" method="post">
    <div><label class="call-request-form-label" for="name">Ваше имя</label></div>
    <div><input class="call-request-form-input" type="text" id="name" name="name" placeholder="Ваше имя *"></div>

    <div><label class="call-request-form-label" for="phone">Ваш номер телефона</label></div>
    <div><input class="call-request-form-input" type="text" id="phone" name="phone" placeholder="Ваш номер телефона *">
    </div>

    <div><label class="call-request-form-label" for="email">Ваш email или VK</label></div>
    <div><input class="call-request-form-input" type="text" id="email" name="email" placeholder="Ваш email или VK *">
    </div>

    <div><label class="call-request-form-label" for="comment">Комментарий</label></div>
    <div><textarea class="call-request-form-textarea" name="comment" id="comment"
                   placeholder="Комментарий (не обязательно)"></textarea></div>

    <p class="message">Заполните и отправьте форму, и мы перезвоним Вам по указанному номеру</p>

    <button class="call-request-form-button" type="submit">Отправить заявку</button>
</form>
</body>
</html>
